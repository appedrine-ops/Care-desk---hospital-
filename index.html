<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b6f6a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CareDesk">
<title>CareDesk Hospital Manager</title>
<style>
/* Layout: fixed left sidebar + scrolling work area; sidebar becomes an off-canvas drawer on phones. */
:root{
  --bg:#f1f5f5; --surface:#ffffff; --ink:#10282b; --muted:#5a7073; --line:#d8e2e3;
  --brand:#0b6f6a; --brand-ink:#ffffff; --soft:#e2f0ef;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --ok:#1d7a4a; --ok-bg:#e0f3e8; --warn:#9a5a08; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe3e1;
  --shadow:0 1px 2px rgba(16,40,43,.06),0 8px 24px rgba(16,40,43,.08);
  --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1a1c; --surface:#132427; --ink:#e4efef; --muted:#8fa8aa; --line:#24393c;
  --brand:#3fb3ab; --brand-ink:#062624; --soft:#173130;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --ok:#5fcf94; --ok-bg:#15301f; --warn:#e5a54b; --warn-bg:#35280f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1a1c; --surface:#132427; --ink:#e4efef; --muted:#8fa8aa; --line:#24393c;
  --brand:#3fb3ab; --brand-ink:#062624; --soft:#173130;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  --ok:#5fcf94; --ok-bg:#15301f; --warn:#e5a54b; --warn-bg:#35280f; --bad:#ff8f86; --bad-bg:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1.title{font:600 24px/1.2 var(--serif);letter-spacing:-.01em}
h2{font:600 17px var(--sans)} h3{font:600 15px var(--sans)} h4{font:600 13px var(--sans);margin:12px 0 4px}
p{margin:0 0 8px} a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--muted)} .sm{font-size:12px} .mono{font-family:var(--mono)} .nowrap{white-space:nowrap}
.right{text-align:right}

/* app shell */
.app{display:flex;min-height:100%}
.side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.brand b{font:600 16px var(--serif);display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--soft);color:var(--brand);font-weight:600}
.nav svg,.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.me{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.me b{display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.topbar .grow{flex:1;min-width:0}
#menuBtn{display:none}
main#view{padding:24px;max-width:1280px;width:100%}
.scrim{display:none}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.rxl{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1.4fr) 70px 32px;gap:8px;align-items:center}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chk{display:flex;flex-direction:row;gap:8px;align-items:center;font-weight:400;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chk span:last-child{margin-left:auto}
@media (max-width:820px){.rxl{grid-template-columns:repeat(2,minmax(0,1fr))}.tests{grid-template-columns:minmax(0,1fr)}}
.viz{display:flex;flex-direction:column;gap:10px}
.donutw{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutw svg{width:140px;height:140px;flex:none}
.donutw .ring{fill:none;stroke-width:22}
.donutw text{fill:var(--ink);font-family:var(--sans)}
.leg{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px;font-size:13px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg b{margin-left:auto;padding-left:8px}
.hb{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;font-size:13px}
.hb .tr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.hb .tr span{display:block;height:100%;border-radius:5px;background:var(--s1)}
.hb .tr span.low{background:var(--s2)}
.hb .tr span.mid{background:var(--s4)}
.hb .lab{display:flex;justify-content:space-between;gap:8px}
.hb .lab span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart .ar{fill:var(--s1);opacity:.14} .chart .ln{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round} .chart .dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.chk.red{border-color:var(--bad);color:var(--bad)}
.btn.bad{color:var(--bad)} .btn.sm{padding:4px 9px;font-size:12px}
a.btn{text-decoration:none;color:var(--ink)}
.hv{display:flex;flex-direction:column;gap:10px}
.hv-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hv-meta{display:grid;gap:2px;min-width:0;overflow-wrap:anywhere}
.hv-acts{display:flex;gap:6px;flex-wrap:wrap}
.btn[disabled]{opacity:.55;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar input[type=search]{max-width:340px}
.bar .grow{flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card+.card{margin-top:16px}
.card>header,.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cols .card+.card{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi b{display:block;font:600 26px/1.2 var(--serif);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.kpi.alert b{color:var(--bad)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row>div{min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.facts span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* chart */
svg.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--brand)} .chart .t{fill:var(--muted);font-size:11px;font-family:var(--sans)} .chart .v{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--sans)} .chart .g{stroke:var(--line);stroke-width:1}

/* AI */
.ai-out{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:80px;margin-top:12px;overflow-wrap:anywhere}
.ai-out ul{padding-left:20px;margin:4px 0 10px} .ai-out code{font-family:var(--mono);background:var(--soft);padding:0 4px;border-radius:4px}
.ai-out h4:first-child{margin-top:0}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding:4px;margin-bottom:10px}
.msg{padding:9px 13px;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
.dots::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:12.5px}
.chips button:hover{border-color:var(--brand);color:var(--brand)}
.score{display:inline-block;min-width:34px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* dialog + toast */
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog.wide{width:min(760px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(8,20,22,.55)}
dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
dialog header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.mbody{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:340px}
.toast.bad{background:var(--bad);color:#fff}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,3fr) 70px minmax(0,1.3fr) 32px;gap:8px;align-items:center}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.login-card form{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.err{color:var(--bad);font-size:13px;min-height:18px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:14px}
details table td{padding:4px 6px;border:0;font-size:12.5px}

/* print */
#printArea{display:none}
@media print{
  body.printing .app,body.printing dialog,body.printing #toasts{display:none!important}
  body.printing #printArea{display:block;padding:24px;color:#000;background:#fff;font-family:var(--sans)}
  body.printing{background:#fff}
  #printArea table td,#printArea table th{border-bottom:1px solid #ccc;color:#000}
  body.printing #printArea{--ink:#000;--muted:#444;--surface:#fff;--line:#ccc;--soft:#e8eceb;--brand:#0b6f6a;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100}
  body.printing #printArea .btn{display:none}
}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,20,22,.5);z-index:20}
  #menuBtn{display:inline-flex}
  .topbar{padding:12px 16px} main#view{padding:16px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .line{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr) 32px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="login-card">
    <div class="brand" style="padding:0">
      <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <div><b id="loginClinic">CareDesk Hospital</b><span>Hospital management system</span></div>
    </div>
    <form id="loginForm" autocomplete="off">
      <label class="f"><span>Username</span><input id="lu" name="u" required autocapitalize="none" autofocus></label>
      <label class="f"><span>Password</span><input id="lp" name="p" type="password" required></label>
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn pri" style="justify-content:center;padding:10px">Sign in</button>
    </form>
    <button type="button" class="btn sm" id="cloudLink" data-act="cloudSetup" style="align-self:center"></button>
    <details>
      <summary>Demo accounts</summary>
      <table><tbody>
        <tr><td>Admin</td><td class="mono">admin / admin123</td></tr>
        <tr><td>Doctor</td><td class="mono">doctor / doctor123</td></tr>
        <tr><td>Nurse</td><td class="mono">nurse / nurse123</td></tr>
        <tr><td>Receptionist</td><td class="mono">reception / reception123</td></tr>
        <tr><td>Gatekeeper</td><td class="mono">gate / gate123</td></tr>
      </tbody></table>
    </details>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <div><b id="sideClinic">CareDesk</b><span>Hospital manager</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="me">
      <div><b id="meName"></b><span class="muted sm" id="meRole"></span></div>
      <button class="btn sm" data-act="logout">Sign out</button>
    </div>
  </aside>
  <div class="scrim" data-act="closeNav"></div>
  <div class="main">
    <header class="topbar">
      <button class="btn" id="menuBtn" data-act="openNav" aria-label="Open menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 class="title grow" id="pageTitle"></h1>
      <button class="pill gray" id="cloudChip" data-act="cloudChip" hidden></button>
      <button class="pill gray" id="aiChip" data-act="goSettings" style="border-radius:99px;cursor:pointer" title="Ollama connection"></button>
    </header>
    <main id="view"></main>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const ageOf=dob=>{if(!dob)return 0;const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const money=n=>(db.settings.currency||'')+' '+Math.round(n||0).toLocaleString();
const fdate=s=>s?new Date(s+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—';
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const sum=a=>a.reduce((x,y)=>x+y,0);
const LS='caredesk.v1', SS='caredesk.session';
const ROLE={admin:'Administrator',doctor:'Doctor',nurse:'Nurse',receptionist:'Receptionist',gatekeeper:'Gatekeeper'};
let db, me, S={view:'dashboard',q:'',id:null,ai:{ok:false,models:[]},chat:[]};

async function sha(s){
  try{ if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('caredesk:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');} }catch(e){}
  let h=5381;for(const c of 'caredesk:'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+h;
}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){toast('Could not save: browser storage is full or blocked.','bad')}}
function save(){localSave();schedulePush()}
function toast(msg,kind=''){const t=document.createElement('div');t.className='toast '+kind;t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),3800)}
const uid=p=>p+(++db.seq)+devCode();
const invId=()=>{const m=Math.max(1000,...db.invoices.map(i=>{const x=/^INV-(\d+)/.exec(String(i.id));return x?+x[1]:0}));return 'INV-'+(m+1)+devCode()};

/* ============ online database (Supabase) ============ */
const SYNC_LS='caredesk.sync';
const SYNC_COLLS=['users','patients','visits','appointments','medicines','invoices','visitors','blocked','requests','homeVisits','rx','labs','docs'];
const LOCAL_ONLY=['ollamaUrl','model'];
let CS=null;try{CS=JSON.parse(localStorage.getItem(SYNC_LS))}catch(e){}
const saveCS=()=>{try{localStorage.setItem(SYNC_LS,JSON.stringify(CS))}catch(e){}};
const cloudOn=()=>!!(CS&&CS.ready&&CS.url&&CS.key&&CS.refresh);

const stable=v=>JSON.stringify(v,(k,x)=>x&&typeof x==='object'&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,y)=>(o[y]=x[y],o),{}):x);
function hash(v){const t=stable(v)||'';let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function localMap(){

const splitKey=k=>{const i=k.indexOf('/');return[k.slice(0,i),k.slice(i+1)]};
function setTok(j){CS.access=j.access_token;CS.refresh=j.refresh_token||CS.refresh;CS.exp=Date.now()+Math.max((j.expires_in||3600)-60,30)*1000;saveCS()}
async function sbToken(){
  if(CS.access&&Date.now()<(CS.exp||0))return CS.access;
  const r=await fetch(CS.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CS.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:CS.refresh})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error('Please sign in to the cloud again.');e.auth=true;throw e}
  setTok(j);return CS.access;
}
async function sbFetch(path,opt={},retry=true){
  const tok=await sbToken();
  const r=await fetch(CS.url+path,Object.assign({},opt,{headers:Object.assign({apikey:CS.key,Authorization:'Bearer '+tok,'Content-Type':'application/json'},opt.headers||{})}));
  if(r.status===401&&retry){CS.exp=0;return sbFetch(path,opt,false)}
  if(!r.ok){const t=await r.text().catch(()=>'');const e=new Error('Cloud error '+r.status+(t?': '+t.slice(0,140):''));e.status=r.status;if(r.status===401)e.auth=true;throw e}
  return r.json().catch(()=>null);
}
async function syncPush(){
  const cur=localMap(),ups=[];
  for(const k in cur){const h=hash(cur[k]);if(CS.snap[k]!==h){const[c,id]=splitKey(k);ups.push({k,h,row:{coll:c,id:id,data:cur[k],deleted:false,updated_by:(me&&me.username)||''}})}}
  for(const k in CS.snap)if(!(k in cur)){const[c,id]=splitKey(k);ups.push({k,h:null,row:{coll:c,id:id,data:null,deleted:true,updated_by:(me&&me.username)||''}})}
  for(let i=0;i<ups.length;i+=200){
    const part=ups.slice(i,i+200);
    await sbFetch('/rest/v1/records?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(part.map(x=>x.row))});
    part.forEach(x=>{if(x.h===null)delete CS.snap[x.k];else CS.snap[x.k]=x.h});saveCS();
  }
  return ups.length;
}
function applyRow(row){
  const k=row.coll+'/'+row.id;
  if(row.coll==='settings'){
    if(row.deleted||!row.data)return false;
    const cur=localMap()[k];
    if(CS.snap[k]!==undefined&&hash(cur)!==CS.snap[k])return false;
    if(hash(row.data)===hash(cur)){CS.snap[k]=hash(cur);return false}
    const d=Object.assign({},row.data);LOCAL_ONLY.forEach(x=>delete d[x]);Object.assign(db.settings,d);CS.snap[k]=hash(localMap()[k]);return true;
  }
  const arr=db[row.coll];if(!arr)return false;
  const i=arr.findIndex(x=>x.id===row.id),cur=i>=0?arr[i]:null,known=CS.snap[k]!==undefined;
  if(cur&&hash(cur)!==CS.snap[k])return false;
  if(row.deleted){delete CS.snap[k];if(cur){arr.splice(i,1);return true}return false}
  if(!cur&&known)return false;
  const h=hash(row.data);
  if(cur&&hash(cur)===h){CS.snap[k]=h;return false}
  if(cur)arr[i]=row.data;else arr.push(row.data);
  CS.snap[k]=h;return true;
}
async function syncPull(){
  let changed=false;
  for(let guard=0;guard<200;guard++){
    const q='/rest/v1/records?select=coll,id,data,deleted,updated_at&order=updated_at.asc&limit=1000'+(CS.cursor?'&updated_at=gte.'+encodeURIComponent(CS.cursor):'');
    const rows=await sbFetch(q)||[];
    rows.forEach(r=>{if(applyRow(r))changed=true});
    const last=rows.length?rows[rows.length-1].updated_at:CS.cursor;
    const moved=last!==CS.cursor;CS.cursor=last;
    if(!(rows.length>=1000&&moved))break;
  }
  if(me)me=db.users.find(u=>u.id===me.id)||me;
  return changed;
}
let syncing=false,again=false,pushT=null,needRender=false,cloudState='sync',cloudErr='';
function schedulePush(){if(!cloudOn())return;clearTimeout(pushT);pushT=setTimeout(syncNow,1200)}
function refreshUI(){

}
async function syncNow(){
  if(!cloudOn())return;
  if(syncing){again=true;return}
  syncing=true;setChip('sync');
  try{
    await syncPush();const ch=await syncPull();
    CS.last=Date.now();saveCS();
    if(ch){localSave();needRender=true}
    setChip('ok');
  }catch(e){setChip(e.auth?'auth':'off',e)}
  finally{syncing=false;refreshUI();if(again){again=false;schedulePush()}}
}

}

const invTotal=i=>sum(i.items.map(x=>x.qty*x.price));
const invPaid=i=>sum(i.payments.map(x=>x.amount));
const invBal=i=>invTotal(i)-invPaid(i);
const invStatus=i=>{const t=invTotal(i),p=invPaid(i);return p>=t&&t>0?'Paid':p>0?'Partial':'Unpaid'};

function stockState(m){
  const dd=dayDiff(today(),m.expiry);
  if(dd<0)return['Expired','bad'];if(m.stock<=0)return['Out of stock','bad'];if(m.stock<=m.reorder)return['Low stock','warn'];if(dd<=60)return['Expiring soon','warn'];return['In stock','ok'];
}

function barChart(vals,labels,fmt=v=>v){
  const W=420,H=150,pl=8,pb=22,pt=16,n=vals.length,max=Math.max(...vals,1),bw=(W-pl*2)/n;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart"><line class="g" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>`+
    vals.map((v,i)=>{const h=(H-pb-pt)*v/max,x=pl+i*bw+bw*.18,w=bw*.64;return `<rect class="b" x="${x}" y="${H-pb-h}" width="${w}" height="${Math.max(h,v?1.5:0)}" rx="3"/><text class="v" x="${x+w/2}" y="${H-pb-h-4}" text-anchor="middle">${v?fmt(v):''}</text><text class="t" x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i])}</text>`}).join('')+`</svg>`;
}

function areaChart(vals,labels,fmt=v=>v){
  const W=420,H=150,pl=8,pb=22,pt=18,n=vals.length,max=Math.max(...vals,1),step=n>1?(W-pl*2)/(n-1):0;
  const X=i=>pl+(n>1?i*step:(W-pl*2)/2),Y=v=>H-pb-(H-pb-pt)*v/max;
  const pts=vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1));
  const every=Math.ceil(n/7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart"><line class="g" x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>`+
   `<polygon class="ar" points="${X(0).toFixed(1)},${H-pb} ${pts.join(' ')} ${X(n-1).toFixed(1)},${H-pb}"/><polyline class="ln" points="${pts.join(' ')}"/>`+
   vals.map((v,i)=>`<circle class="dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>${i%every===0||i===n-1?`<text class="t" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${esc(labels[i])}</text>`:''}${v===max&&v>0?`<text class="v" x="${X(i).toFixed(1)}" y="${Y(v)-9}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${fmt(v)}</text>`:''}`).join('')+`</svg>`;
}
function donutChart(items,centre,cf){
  const cp=cf||(v=>v);
  const tot=sum(items.map(x=>x.v));
  if(!tot)return empty('No data yet.');
  const R=44,C=2*Math.PI*R;let off=0;
  const arcs=items.filter(x=>x.v>0).map((x,i)=>{const len=C*x.v/tot,a=`<circle class="ring" cx="70" cy="70" r="${R}" stroke="var(--s${items.indexOf(x)+1})" stroke-dasharray="${Math.max(len-2,0.5).toFixed(2)} ${(C-Math.max(len-2,0.5)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 70 70)"><title>${esc(x.l)}: ${x.v}</title></circle>`;off+=len;return a}).join('');
  return `<div class="donutw"><svg viewBox="0 0 140 140" role="img" aria-label="Donut chart">${arcs}<text x="70" y="70" text-anchor="middle" font-size="${cf?16:22}" font-weight="700">${cp(tot)}</text><text x="70" y="88" text-anchor="middle" font-size="10" style="fill:var(--muted)">${esc(centre||'total')}</text></svg>
  <div class="leg">${items.map((x,i)=>`<div><i style="background:var(--s${i+1})"></i><span>${esc(x.l)}</span><b>${cp(x.v)} <span class="muted sm">(${Math.round(x.v/tot*100)}%)</span></b></div>`).join('')}</div></div>`;
}
function hbars(items,fmt=v=>v){
  if(!items.length)return empty('No data yet.');
  const max=Math.max(...items.map(x=>x.v),1);
  return `<div class="viz">${items.map(x=>`<div class="hb"><div class="lab"><span>${esc(x.l)}</span><b>${fmt(x.v)}${x.note?` <span class="muted sm">${esc(x.note)}</span>`:''}</b></div><div class="tr"><span class="${x.tone||''}" style="width:${Math.max(x.v/max*100,2).toFixed(1)}%"></span></div></div>`).join('')}</div>`;
}

/* ============ Ollama ============ */
let abortCtl=null;
async function ollamaChat(messages,onToken,signal){
  const s=db.settings;let r;
  try{r=await fetch(s.ollamaUrl.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal,body:JSON.stringify({model:s.model,messages,stream:true,options:{temperature:.3}})})}
  catch(e){if(e.name==='AbortError')throw e;throw new Error(`Cannot reach Ollama at ${s.ollamaUrl}. Start it with "ollama serve". If this page is opened from a file, start Ollama with OLLAMA_ORIGINS="*".`)}
  if(!r.ok)throw new Error(r.status===404?`Model "${s.model}" is not installed. Run: ollama pull ${s.model}`:`Ollama returned status ${r.status}.`);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
      try{const j=JSON.parse(line);const tk=j.message?.content||'';if(tk){full+=tk;onToken&&onToken(full)}}catch(e){}}}
  return full;
}
function md(t){
  const lines=esc(t).split('\n');let out='',inL=false;const close=()=>{if(inL){out+='</ul>';inL=false}};
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){close();out+=`<h4>${m[1]}</h4>`}
    else if((m=l.match(/^\s*[-*•]\s+(.*)/)||l.match(/^\s*\d+[.)]\s+(.*)/))){if(!inL){out+='<ul>';inL=true}out+=`<li>${m[1]}</li>`}
    else if(!l.trim())close();else{close();out+=`<p>${l}</p>`}
  }
  close();return out;
}
async function runAI(outEl,messages,btn){
  if(abortCtl)abortCtl.abort();
  abortCtl=new AbortController();const mine=abortCtl;
  const label=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Working…'}
  outEl.innerHTML='<span class="dots"></span> <span class="muted">Waiting for the model…</span>';
  const stop=$('#stopAI');if(stop)stop.hidden=false;
  try{
    const full=await ollamaChat(messages,t=>{outEl.innerHTML=md(t)},mine.signal);
    outEl.innerHTML=md(full||'(empty response)');return full;
  }catch(e){
    if(e.name==='AbortError'){outEl.insertAdjacentHTML('beforeend','<p class="muted sm">Stopped.</p>');return null}
    outEl.innerHTML=`<div class="note" style="margin:0">${esc(e.message)}</div>`;checkAI();return null;
  }finally{if(btn){btn.disabled=false;btn.textContent=label}if(stop)stop.hidden=true;if(abortCtl===mine)abortCtl=null}
}

  const chip=$('#aiChip');chip.textContent='AI: checking…';

}

/* ---- data clean-up (delete) ---- */
const PCOLL=['visits','appointments','invoices','rx','labs','docs','homeVisits'];
function patientData(ids){
  const set=new Set(ids),o={patients:db.patients.filter(p=>set.has(p.id))};
  PCOLL.forEach(k=>o[k]=(db[k]||[]).filter(x=>set.has(x.patientId)));
  return o;
}
function purgePatients(ids){
  const set=new Set(ids);
  db.patients=db.patients.filter(p=>!set.has(p.id));
  PCOLL.forEach(k=>{if(db[k])db[k]=db[k].filter(x=>!set.has(x.patientId))});
  (db.requests||[]).forEach(r=>{if(set.has(r.patientId))r.patientId=''});
  db.visitors.forEach(v=>{if(set.has(v.patientId)){v.patientId='';v.host=v.host||'(record removed)'}});
}

V.appointments=()=>{
  const f=S.afilter||'upcoming',t=today();
  if(f==='recall')return recallView();
  let list=db.appointments.slice();
  if(f==='upcoming')list=list.filter(a=>a.date>=t&&a.status==='Scheduled');
  else if(f==='today')list=list.filter(a=>a.date===t);

  return `<div class="bar"><div class="tabs" style="margin:0;border:0" role="tablist">${[['upcoming','Upcoming'],['today','Today'],['past','Past'],['all','All'],['recall','Due for review']].map(x=>`<button role="tab" aria-selected="${f===x[0]}" data-act="afilter" data-f="${x[0]}">${x[1]}</button>`).join('')}</div><span class="grow"></span><button class="btn pri" data-act="newAppt">Schedule appointment</button></div>
  <div class="card" style="padding:6px">${list.length?`<div class="tw"><table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td class="nowrap">${a.date===t?'<b>Today</b>':fdate(a.date)}</td><td class="mono">${a.time}</td><td><a href="#patient/${a.patientId}" data-act="openPatient" data-id="${a.patientId}">${esc(pname(a.patientId))}</a></td><td>${esc(docName(a.doctorId))}</td><td>${esc(a.reason)}</td><td>${pill(a.status)}</td>
    <td class="right nowrap">${a.status==='Scheduled'?`<button class="btn sm" data-act="apptMsg" data-id="${a.id}">Message</button> <button class="btn sm" data-act="apptStatus" data-id="${a.id}" data-s="Completed">Complete</button> <button class="btn sm" data-act="apptStatus" data-id="${a.id}" data-s="No-show">No-show</button> <button class="btn sm bad" data-act="apptStatus" data-id="${a.id}" data-s="Cancelled">Cancel</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:empty('No appointments in this view.')}</div>`;
};
function newAppt(pid,rq){
  const docs=doctors();if(!docs.length){toast('Add a doctor in Staff accounts first.','bad');return}
  openModal('Schedule appointment',`${sel('Patient','patientId',patOpts(),pid||'')}${sel('Doctor','doctorId',docs.map(d=>[d.id,d.name]))}
  <div class="grid2">${fld('Date','date',(rq&&rq.prefDate&&rq.prefDate>=today())?rq.prefDate:plus(1),'date','required min="'+today()+'"')}${fld('Time','time',(rq&&rq.prefTime)||'09:00','time','required')}</div>${fld('Reason','reason','Consultation','text','required')}`,{onSubmit:fd=>{
    const o=Object.fromEntries(fd);
    if(db.appointments.some(a=>a.doctorId===o.doctorId&&a.date===o.date&&a.time===o.time&&a.status==='Scheduled')){toast(`${docName(o.doctorId)} already has an appointment at ${o.time} on ${fdate(o.date)}.`,'bad');return false}
    const ap={id:uid('A'),...o,status:'Scheduled'};db.appointments.push(ap);
    if(rq){rq.status='Booked';rq.apptId=ap.id;rq.patientId=o.patientId}

    if(rq)setTimeout(()=>confirmAppt(ap,rq),0);
  }});

      inv.items.push({desc:m.name,qty:q,price:m.price})}

function riskFor(p){
  const t=today(),a=ageOf(p.dob),f=[];let s=0;
  const add=(pts,why)=>{s+=pts;f.push(why)};
  if(a>=75)add(3,'Age 75+');else if(a>=65)add(2,'Age 65+');else if(a<=5)add(1,'Young child');
  const ch=(p.chronic||'').split(',').map(x=>x.trim()).filter(Boolean);if(ch.length)add(Math.min(ch.length*1.5,5),`${ch.length} chronic condition${ch.length>1?'s':''}`);
  const adm=db.visits.filter(v=>v.patientId===p.id&&v.admitted&&dayDiff(v.date,t)<=180);if(adm.length)add(adm.length*2,`${adm.length} admission${adm.length>1?'s':''} in 6 months`);
  if(adm.some(v=>v.discharge&&dayDiff(v.discharge,t)<=30&&dayDiff(v.discharge,t)>=0))add(2,'Discharged within 30 days');
  const v90=db.visits.filter(v=>v.patientId===p.id&&dayDiff(v.date,t)<=90).length;if(v90>=3)add(1,`${v90} visits in 90 days`);
  const ns=db.appointments.filter(x=>x.patientId===p.id&&x.status==='No-show').length;if(ns)add(ns,`${ns} missed appointment${ns>1?'s':''}`);
  return{p,score:Math.round(s*10)/10,factors:f,level:s>=6?['High','bad']:s>=3?['Medium','warn']:['Low','ok']};
}
V.ai_risk=()=>{
  const rs=db.patients.map(riskFor).sort((a,b)=>b.score-a.score);S.risks=rs;

const VPURPOSE=['Visiting a patient','Outpatient appointment','Delivery','Official / contractor','Other'];

const vNow=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const visitStart=()=>db.settings.visitStart||'14:00', visitEnd=()=>db.settings.visitEnd||'20:00';

const vActive=()=>db.visitors.filter(v=>!v.timeOut);
const vOverdue=v=>!v.timeOut&&v.purpose==='Visiting a patient'&&(iso(new Date(v.timeIn))!==today()||vNow()>visitEnd());
const vTime=t=>t?new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';
const vDur=v=>{const m=Math.max(0,Math.round(((v.timeOut?new Date(v.timeOut):new Date())-new Date(v.timeIn))/6e4));return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
const wardOf=p=>p?[p.ward,p.bed?'bed '+p.bed:''].filter(Boolean).join(' / '):'';

const normId=x=>String(x||'').replace(/\s+/g,'').toLowerCase();
const isBlocked=(phone,idno)=>db.blocked.find(b=>(normId(b.phone)&&normId(b.phone)===normId(phone))||(normId(b.idNumber)&&normId(b.idNumber)===normId(idno)));

  ${fld('Override reason (only if outside visiting hours)','override')}`,{wide:true,submit:'Check in',onSubmit:fd=>{

  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=cc+d.slice(1);else if(!d.startsWith(cc)&&d.length<=9)d=cc+d;

}

const FREQS=['Once daily','Twice daily','Three times daily','Four times daily','At night','Every 8 hours','As needed'];
const ALLERGY_MAP={penicillin:['penicillin','amoxicillin','ampicillin','cloxacillin','flucloxacillin','amoxiclav','augmentin'],sulfa:['cotrimoxazole','co-trimoxazole','septrin','sulfamethoxazole','sulfadoxine','sulphadoxine','fansidar','bactrim'],sulph:['cotrimoxazole','co-trimoxazole','septrin','sulfamethoxazole','sulfadoxine','sulphadoxine','fansidar'],aspirin:['aspirin','ibuprofen','diclofenac','naproxen'],nsaid:['aspirin','ibuprofen','diclofenac','naproxen','indomethacin'],cephalosporin:['ceftriaxone','cefuroxime','cefixime','cephalexin','cefotaxime']};
function allergyConflicts(p,drug){
  const d=(drug||'').toLowerCase().trim(),out=[];if(!d)return out;
  const w=d.split(/[\s\/]+/)[0];
  (p.allergies||'').toLowerCase().split(',').map(x=>x.trim()).filter(Boolean).forEach(a=>{
    if(d.includes(a)||(w.length>3&&a.includes(w))){out.push(a);return}
    for(const k in ALLERGY_MAP)if(a.includes(k)&&ALLERGY_MAP[k].some(x=>d.includes(x))){out.push(a);break}
  });
  return out;
}

const LABCAT=[
 {n:'Malaria RDT',t:'q',price:10000},{n:'Malaria blood smear',t:'q',price:10000},
 {n:'Haemoglobin',t:'n',unit:'g/dL',lo:12,hi:16,loM:13,hiM:17,price:8000},
 {n:'White blood cell count',t:'n',unit:'×10⁹/L',lo:4,hi:11,price:10000},
 {n:'Platelet count',t:'n',unit:'×10⁹/L',lo:150,hi:400,price:10000},
 {n:'Random blood sugar',t:'n',unit:'mmol/L',lo:3.9,hi:7.8,price:5000},
 {n:'Fasting blood sugar',t:'n',unit:'mmol/L',lo:3.9,hi:5.6,price:5000},
 {n:'Creatinine',t:'n',unit:'µmol/L',lo:50,hi:110,price:15000},
 {n:'HIV rapid test',t:'q',price:5000},{n:'Hepatitis B surface antigen',t:'q',price:15000},
 {n:'Pregnancy test (urine)',t:'q',price:5000},{n:'Typhoid test',t:'q',price:10000},
 {n:'Urinalysis',t:'t',price:8000},{n:'Stool microscopy',t:'t',price:8000},{n:'Blood group',t:'t',price:5000}];
function labRange(c,p){const m=p&&p.sex==='M';return{lo:m&&c.loM!==undefined?c.loM:c.lo,hi:m&&c.hiM!==undefined?c.hiM:c.hi}}
function refText(c,p){if(c.t==='q')return 'Negative';if(c.t==='n'){const r=labRange(c,p);return r.lo+'–'+r.hi+' '+c.unit}return ''}
function labFlag(t,p){
  const c=LABCAT.find(x=>x.n===t.name);if(!c||t.result===''||t.result==null)return '';
  if(c.t==='q')return /pos|reactive|detected/i.test(t.result)?'Positive':'';
  if(c.t==='n'){const v=parseFloat(t.result);if(isNaN(v))return '';const r=labRange(c,p);return v<r.lo?'Low':v>r.hi?'High':''}
  return '';
}

function recallList(){
  const t=today(),days=+db.settings.recallDays||90,out=[];
  const sched=new Set(db.appointments.filter(a=>a.status==='Scheduled'&&a.date>=t).map(a=>a.patientId));
  db.patients.forEach(p=>{
    if(!(p.chronic||'').trim()||sched.has(p.id))return;
    const dates=[...db.visits.filter(v=>v.patientId===p.id).map(v=>v.date),...db.homeVisits.filter(h=>h.patientId===p.id&&h.status==='Completed').map(h=>h.date)].sort();
    const last=dates.pop(),since=last?dayDiff(last,t):9999;
    if(since>=days)out.push({p:p,last:last,since:since});
  });
  return out.sort((a,b)=>b.since-a.since);
}

function sampleClinical(){

  return{
   rx:[{id:uid('RX'),patientId:P(1).id,date:plus(-6),doctor:'Dr. Amina Nsubuga',items:[{drug:'Amlodipine 5mg',dose:'5mg',freq:'Once daily',days:30}],notes:'Take in the morning. Return for a blood pressure check in 4 weeks.',allergyOverride:false}],
   labs:[mk(0,[['Random blood sugar'],['Haemoglobin']],{note:'Diabetes review'}),
         mk(6,[['Fasting blood sugar','8.2'],['Haemoglobin','11.4']],{date:plus(-2),status:'Resulted',resultedBy:'Nurse Janet Auma',resultedAt:new Date(Date.now()-17e7).toISOString(),comment:'Sugar above target. Review medication.'})]

function labContext(p){
  if(!p||!db.labs)return '';
  const r=db.labs.filter(l=>l.patientId===p.id&&l.status==='Resulted').sort((a,b)=>b.date<a.date?-1:1).slice(0,3);
  return r.length?'\nRecent lab results:\n'+r.map(l=>'- '+l.date+': '+l.tests.map(t=>t.name+' '+t.result+(t.flag?' ('+t.flag+')':'')).join('; ')).join('\n'):''
}

    catch(e){toast(e.message,'bad')}finally{btn.disabled=false;btn.textContent=orig}
  },
  waRem:d=>{const el=$('#'+d.id);const u=waUrl(d.phone,el&&el.value);if(!u){toast('This phone number cannot be used for WhatsApp.','bad');return}openExternal(u)},
  copyLink:()=>{const v=$('#bkLink').value;navigator.clipboard?navigator.clipboard.writeText(v).then(()=>toast('Link copied.'),()=>toast('Copy failed. Select the link and copy it.','bad')):toast('Select the link and copy it.','bad')},
  shareLink:()=>openExternal('https://wa.me/?text='+encodeURIComponent('Book an appointment or a home visit with '+db.settings.clinic+': '+bookingLink())),
  pfilter:d=>{S.pfilter=d.f;render()},
  sendHome:d=>{const p=pat(d.id);openModal('Mark as sent home',`<p style="margin:0"><b>${esc(p.name)}</b> has healed and is going home. Any ward admission will be closed as discharged today. You can re-open the file later if the patient returns.</p>`,{submit:'Sent home',onSubmit:()=>{p.sentHome=today();db.visits.filter(v=>v.patientId===p.id&&v.admitted&&!v.discharge).forEach(v=>v.discharge=today());save();toast(p.name+' marked as sent home.');render()}})},
  undoHome:d=>{const p=pat(d.id);delete p.sentHome;save();toast('File re-opened.');render()},
  delPatient:d=>askDeletePatients([d.id],'Delete patient record'),
  delHome:()=>askDeletePatients(db.patients.filter(p=>p.sentHome).map(p=>p.id),'Delete all sent-home patients'),
  delMed:d=>{if(me.role!=='admin')return;const m=db.medicines.find(x=>x.id===d.id);openModal('Delete medicine',`<p style="margin:0">Remove <b>${esc(m.name)}</b> (${m.stock} ${esc(m.unit)} in stock) from the inventory? Past invoices keep their lines.</p><label class="chk red"><input type="checkbox" name="sure" required style="width:auto"><span>I understand this cannot be undone</span></label>`,{submit:'Delete medicine',onSubmit:()=>{db.medicines=db.medicines.filter(x=>x.id!==d.id);save();toast(m.name+' deleted.');render()}})},
  delVisitor:d=>{if(!canBlock())return;const v=db.visitors.find(x=>x.id===d.id);if(!v||!v.timeOut){toast('Check the visitor out first.','bad');return}openModal('Delete visitor record',`<p style="margin:0">Delete the record for <b>${esc(v.name)}</b>?</p>`,{submit:'Delete',onSubmit:()=>{db.visitors=db.visitors.filter(x=>x.id!==d.id);save();toast('Record deleted.');render()}})},
  clearVisitors:()=>askDeleteVisitors(),
  cloudSetup:()=>{if(cloudOn()&&!(me&&me.role==='admin')){toast(cloudState==='ok'?'Online database: synced.':cloudErr||'Online database: waiting to sync.',cloudState==='ok'?'':'bad');return}cloudSetup()},
  cloudChip:()=>{if(me&&me.role==='admin')cloudSetup();else toast(cloudState==='ok'?'Online database: synced.':cloudErr||'Online database: waiting to sync.',cloudState==='ok'?'':'bad')},
  syncNow:()=>{toast('Syncing…');syncNow()},
  cloudOff:()=>{if(!(me&&me.role==='admin'))return;setTimeout(()=>openModal('Disconnect this phone','<p style="margin:0">This phone keeps its current records but stops syncing. Other phones are not affected. You can connect again later.</p>',{submit:'Disconnect',onSubmit:()=>{CS=null;try{localStorage.removeItem(SYNC_LS)}catch(e){}updChip();toast('Disconnected.');render()}}),0)},
  printChart:d=>{const c=chartDefs().find(x=>x.k===d.k);if(c)printHTML(chartPrintHTML([c]))},
  printCharts:()=>printHTML(chartPrintHTML(chartDefs())),
  newRx:d=>newRx(d.id),
  addRx:(d,el)=>{el.closest('form').querySelector('#rxlines').insertAdjacentHTML('beforeend',rxLine())},
  rmRx:(d,el)=>{const b=el.closest('#rxlines');if(b&&b.children.length>1)el.closest('.rxl').remove()},
  rxPrint:d=>printHTML(rxHTML(db.rx.find(x=>x.id===d.id))),
  docNew:d=>docModal(d.t,d.id),
  docPrint:d=>printHTML(docHTML(db.docs.find(x=>x.id===d.id))),
  orderLab:d=>orderLab(d.id),
  lfilter:d=>{S.lfilter=d.f;render()},
  labEnter:d=>enterResults(d.id),
  labPrint:d=>printHTML(labHTML(db.labs.find(x=>x.id===d.id))),
  rcPrint:d=>printHTML(receiptHTML(db.invoices.find(x=>x.id===d.id),+d.i)),
  rcMsg:d=>{const i=db.invoices.find(x=>x.id===d.id),p=pat(i.patientId);messageModal('Send receipt',{name:p.name,phone:p.phone,email:p.email,text:receiptText(i,+d.i),subject:'Receipt from '+db.settings.clinic})},
  recallMsg:d=>{const p=pat(d.id),r=recallList().find(x=>x.p.id===d.id),mo=r&&r.since<9999?Math.max(1,Math.round(r.since/30)):null;
    messageModal('Review reminder',{name:p.name,phone:p.phone,email:p.email,text:'Hello '+p.name.split(' ')[0]+', this is '+db.settings.clinic+'. '+(mo?'It has been about '+mo+' month'+(mo>1?'s':'')+' since your last visit. ':'')+'It is time for your review ('+p.chronic+'). Please reply with a day that suits you, or call '+(db.settings.clinicPhone||'us')+'. Thank you.',subject:'Time for your review - '+db.settings.clinic})},
  recallBook:d=>newAppt(d.id),
  regVisitor:()=>regVisitor(),
  visitorOut:d=>{const v=db.visitors.find(x=>x.id===d.id);v.timeOut=new Date().toISOString();save();toast(`${v.name} checked out. Collect badge ${v.badge}.`);render()},
  visitorBadge:d=>printHTML(badgeHTML(db.visitors.find(x=>x.id===d.id))),
  exportVisitors:()=>{const rows=[['Date','Name','Phone','ID type','ID number','Purpose','Visiting','Time in','Time out','Badge','Plate','Items','Override','Checked in by'],...db.visitors.map(v=>[iso(new Date(v.timeIn)),v.name,v.phone,v.idType,v.idNumber,v.purpose,vTarget(v),vTime(v.timeIn),v.timeOut?vTime(v.timeOut):'',v.badge,v.plate||'',v.items||'',v.override||'',v.by])];download('visitor-log-'+today()+'.csv',csv(rows),'text/csv')},
  addBlock:()=>openModal('Block a person',`${fld('Full name','name','','text','required')}<div class="grid2">${fld('Phone','phone','','tel')}${fld('ID number','idNumber')}</div>${fld('Reason','reason','','text','required')}<p class="muted sm">Enter a phone number or ID number so the match works at the gate.</p>`,{submit:'Block',onSubmit:fd=>{
    const o=Object.fromEntries(fd);if(!o.phone.trim()&&!o.idNumber.trim()){toast('Enter a phone number or an ID number.','bad');return false}
    db.blocked.push({id:uid('B'),...o,date:today(),by:me.name});save();
    const inside=vActive().find(v=>normId(v.phone)===normId(o.phone)&&normId(o.phone)||normId(v.idNumber)===normId(o.idNumber)&&normId(o.idNumber));
    toast(inside?`${o.name} is blocked, but is still inside. Check them out.`:`${o.name} added to the blocked list.`,inside?'bad':'');render()}}),
  delBlock:d=>openModal('Remove from blocked list','<p>This person will be allowed to check in again.</p>',{submit:'Remove',onSubmit:()=>{db.blocked=db.blocked.filter(b=>b.id!==d.id);save();toast('Removed from blocked list.');render()}})
});

/* ============ install / offline support ============ */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
/* ============ boot ============ */
function showLogin(){$('#cloudLink').textContent=cloudOn()?'Online database connected ✓':'Connect this phone to the online database';$('#app').hidden=true;$('#login').hidden=false;$('#loginClinic').textContent=db.settings.clinic;$('#lu').value='';$('#lp').value='';$('#lerr').textContent='';location.hash=''}
function enter(){
  $('#login').hidden=true;$('#app').hidden=false;
  $('#meName').textContent=me.name;$('#meRole').textContent=ROLE[me.role];buildNav();
  const [v,id]=location.hash.slice(1).split('/');
  if(v&&(PERM[v]&&can(v)||v==='patient'&&can('patients')))go(v,id);else go(can('dashboard')?'dashboard':'visitors');
  $('#aiChip').hidden=me.role==='gatekeeper';updChip();syncNow();
  if(me.role!=='gatekeeper')checkAI();
}
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=db.users.find(x=>x.username===$('#lu').value.trim().toLowerCase());
  if(u&&u.hash===await sha($('#lp').value)){me=u;sessionStorage.setItem(SS,u.id);enter()}else $('#lerr').textContent='Wrong username or password.';
});
(async()=>{
  await loadDb();
  if(cloudOn())syncNow();
  const sid=sessionStorage.getItem(SS);me=db.users.find(u=>u.id===sid)||null;
  if(me)enter();else showLogin();
})();
</script>
</body>
